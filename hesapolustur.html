<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Oluşturun</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: url('orgumm.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            color: white;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 26px;
        }

        .input-box {
            margin-bottom: 15px;
            width: 100%;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: #8d2941;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #731f33;
        }

        .login-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hesap Oluşturun</h2>

        <div class="input-box">
            <input type="text" placeholder="Ad Soyad">
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Şifre">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Şifre Tekrar">
        </div>

        <button class="register-btn" onclick="hesapOlustur()">Kayıt Ol</button>


        <div class="login-link">
            Zaten hesabınız var mı? <a href="login.html">Giriş Yapın</a>
        </div>
    </div>

    <script>
    function hesapOlustur() {
        alert("Hesap başarıyla oluşturuldu!");
        window.location.href = "login.html"; // Giriş sayfasına yönlendir
    }
    </script>
    
    



</body>
</html>
