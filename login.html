<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: url('login.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            color: white;
        }

        .container h2 {
            margin-bottom: 30px;
            font-size: 26px;
        }

        .input-box {
            width: 100%;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            background: #8d2941;
            border: none;
            cursor: pointer;
            color: white;
            font-size: 17px;
            margin-top: 5px;
        }

        .text-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #ddd;
            text-decoration: none;
        }

        .social {
            margin-top: 25px;
            font-size: 14px;
        }

        .icons {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .icons img {
            width: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hoş Geldiniz</h2>

        <div class="input-box">
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>


        <script>
        function girisYap() {
            alert("Giriş başarılı!");
            window.location.href = "anasayfa.html"; // Anasayfaya yönlendir
        }
        </script>


        <button class="login-btn" onclick="girisYap()">LOGIN</button>


        <div class="text-row">
            <a href="#">Forgot Password?</a>
            <a href="#">Sign Up</a>
        </div>
    </div>

</body>
</html>
